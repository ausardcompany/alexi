name: Security Scanning

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday

jobs:
  npm-audit:
    name: NPM Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Run npm audit
        # H4 remediation (role-security audit 2026-10-12 R3, carry-over
        # from 2026-09-21 R6): the gate had `continue-on-error: true`
        # for six consecutive audits, so high-severity findings
        # accumulated silently. Enforce `critical` now (0 criticals
        # today -- see audit 2026-10-12 Summary) so the job cannot
        # pass green on future critical regressions; tighten to
        # `--audit-level=high` once C2 / H1 / H2 / H6 clear. Scope to
        # `--omit=dev` so dev-only chains (brace-expansion, nested
        # nanoid, etc.) do not drive the gate.
        run: npm audit --audit-level=critical --omit=dev

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: typescript
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
